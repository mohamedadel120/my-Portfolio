name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Dart 🛠️
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Activate Jaspr CLI 📦
        # Pinned to the same version used during local development for
        # reproducibility. 0.23.1 fails outright here ("Failed to start
        # build daemon, port file is missing" / "use the latest version of
        # build_runner") -- reproduced locally, 0.23.2 builds cleanly.
        run: dart pub global activate jaspr_cli 0.23.2

      - name: Install dependencies 📦
        working-directory: jaspr_site
        run: dart pub get

      - name: Build Jaspr site 🏗️
        working-directory: jaspr_site
        run: dart pub global run jaspr_cli:jaspr build --sitemap-domain=https://muhammed-adel.web.app

      - name: Deploy to Firebase Hosting 🚀
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_WEBSITE_BF9E6 }}"
          projectId: my-website-bf9e6
          channelId: live
