name: Deploy to Firebase Hosting

# The Jaspr site fetches its content from Firestore at build time, so a
# Firestore edit only goes live after a rebuild. Besides pushes to main, the
# site is rebuilt daily on a schedule and can be rebuilt on demand from the
# Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer run waits for the current one.
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Dart 🛠️
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Activate Jaspr CLI 📦
        # Pinned to the same version used during local development for
        # reproducibility. 0.23.1 fails outright here ("Failed to start
        # build daemon, port file is missing" / "use the latest version of
        # build_runner") -- reproduced locally, 0.23.2 builds cleanly.
        run: dart pub global activate jaspr_cli 0.23.2

      - name: Install dependencies 📦
        working-directory: jaspr_site
        run: dart pub get

      - name: Build Jaspr site 🏗️
        working-directory: jaspr_site
        run: dart pub global run jaspr_cli:jaspr build --sitemap-domain=https://muhammed-adel.web.app

      - name: Deploy to Firebase Hosting 🚀
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_WEBSITE_BF9E6 }}"
          projectId: my-website-bf9e6
          channelId: live
