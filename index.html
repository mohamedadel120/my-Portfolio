<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/my-Portfolio/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Mohamed Adel - Flutter Developer Portfolio. A modern, animated portfolio website showcasing mobile app development expertise, projects, and experience."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Mohamed Adel" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Mohamed Adel - Flutter Developer Portfolio</title>
    <link rel="manifest" href="manifest.json" />

    <!-- SEO Meta Tags -->
    <meta
      name="keywords"
      content="Flutter Developer, Mobile App Developer, Portfolio, Mohamed Adel, Dart, iOS, Android, Cross-platform Development"
    />
    <meta name="author" content="Mohamed Adel" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://muhammed-adel.web.app/"
    />
    <meta
      property="og:title"
      content="Mohamed Adel - Flutter Developer Portfolio"
    />
    <meta
      property="og:description"
      content="A modern, animated portfolio website showcasing mobile app development expertise, projects, and experience."
    />
    <meta
      property="og:image"
      content="https://muhammed-adel.web.app/icons/Icon-512.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://muhammed-adel.web.app/"
    />
    <meta
      property="twitter:title"
      content="Mohamed Adel - Flutter Developer Portfolio"
    />
    <meta
      property="twitter:description"
      content="A modern, animated portfolio website showcasing mobile app development expertise, projects, and experience."
    />
    <meta
      property="twitter:image"
      content="https://muhammed-adel.web.app/icons/Icon-512.png"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohamed Adel",
        "url": "https://muhammed-adel.web.app/",
        "image": "https://muhammed-adel.web.app/icons/Icon-512.png",
        "sameAs": [
          "https://github.com/mohamedadel120",
          "https://www.linkedin.com/in/mohamed-adel/"
        ],
        "jobTitle": "Flutter Developer",
        "worksFor": {
          "@type": "Organization",
          "name": "Freelance"
        },
        "description": "Experienced Flutter Developer specializing in building high-quality mobile applications for iOS and Android."
      }
    </script>
    <!-- Preconnect for Google Fonts: the google_fonts Dart package fetches font
         bytes directly from fonts.gstatic.com for Flutter's canvas text renderer,
         so this warms that connection. A CSS <link> to fonts.googleapis.com is
         NOT needed here (Flutter web paints text via Skia, not the DOM/CSS text
         pipeline) and previously caused every font to be downloaded twice. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload Splash Logo for faster perceived performance -->
    <link rel="preload" href="splash_logo.webp" as="image">

    <style>
      body {
        background-color: #000000; /* AppColors.background */
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: "JetBrains Mono", monospace;
      }

      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .logo-image {
        width: 120px; /* Optimized size for splash screen */
        max-width: 40vw;
        height: auto;
        animation: pulseLogo 3s infinite ease-in-out;
      }

      .loader-text {
        color: #00D9FF; /* Primary color */
        font-family: 'Space Mono', monospace;
        font-size: 16px;
        letter-spacing: 2px;
        font-weight: 500;
        opacity: 0.8;
        display: flex;
        align-items: center;
        min-height: 24px;
      }

      .cursor {
        display: inline-block;
        width: 10px;
        height: 20px;
        background-color: #00D9FF;
        margin-left: 4px;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes pulseLogo {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-container">
      <img src="splash_logo.webp" alt="Loading Logo" class="logo-image" />
      <div class="loader-text">
        <span id="typewriter-text"></span><span class="cursor"></span>
      </div>
    </div>

    <script>
      // Typewriter effect
      const text = " several day's of work loading";
      const chars = Array.from(text);
      const el = document.getElementById('typewriter-text');
      let i = 0;
      
      function typeWriter() {
        if (i < chars.length) {
          el.innerHTML += chars[i];
          i++;
          const speed = Math.random() * 50 + 50; 
          setTimeout(typeWriter, speed);
        }
      }
      
      // Start typing after 1 second (gives time for video logo to appear first)
      setTimeout(typeWriter, 1000);
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
