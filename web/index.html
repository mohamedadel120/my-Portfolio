    <!-- Preconnect for Google Fonts: the google_fonts Dart package fetches font
         bytes directly from fonts.gstatic.com for Flutter's canvas text renderer,
         so this warms that connection. A CSS <link> to fonts.googleapis.com is
         NOT needed here (Flutter web paints text via Skia, not the DOM/CSS text
         pipeline) and previously caused every font to be downloaded twice. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- The Flutter engine (skwasm/canvaskit) is fetched from www.gstatic.com;
         warming the connection saves DNS+TLS time on the critical path. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <!-- Start downloading the app's WASM module and its JS glue immediately,

         waiting for it to request them. -->

    <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin>


    <style>
      body {
        background-color: #000000; /* AppColors.background */
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: "JetBrains Mono", monospace;
      }

      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .logo-image {
        width: 120px; /* Optimized size for splash screen */
        max-width: 40vw;
        height: auto;
        animation: pulseLogo 3s infinite ease-in-out;
      }

      .loader-text {
        color: #00D9FF; /* Primary color */
        font-family: 'Space Mono', monospace;
        font-size: 16px;
        letter-spacing: 2px;
        font-weight: 500;
        opacity: 0.8;
        display: flex;
        align-items: center;
        min-height: 24px;
      }

      .cursor {
        display: inline-block;
        width: 10px;
        height: 20px;
        background-color: #00D9FF;
        margin-left: 4px;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes pulseLogo {
        0%,
        100% {
          opacity: 0.7;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>

    <script>
      // Typewriter effect
      const text = "SEVERAL DAYS OF HARD WORK LOADING...";
      const chars = Array.from(text);
      const el = document.getElementById('typewriter-text');
      let i = 0;
      
      function typeWriter() {
        if (i < chars.length) {
          el.innerHTML += chars[i];
          i++;
          const speed = Math.random() * 50 + 50; 
          setTimeout(typeWriter, speed);
        }
      }
      
      // Start typing after 1 second (gives time for video logo to appear first)
      setTimeout(typeWriter, 1000);
    </script>
