<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Mohamed Adel - Flutter Developer Portfolio. A modern, animated portfolio website showcasing mobile app development expertise, projects, and experience."
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Mohamed Adel" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Mohamed Adel - Flutter Developer Portfolio</title>
    <link rel="manifest" href="manifest.json" />

    <!-- SEO Meta Tags -->
    <meta
      name="keywords"
      content="Flutter Developer, Mobile App Developer, Portfolio, Mohamed Adel, Dart, iOS, Android, Cross-platform Development"
    />
    <meta name="author" content="Mohamed Adel" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://mohamedadel120.github.io/my-Portfolio/"
    />
    <meta
      property="og:title"
      content="Mohamed Adel - Flutter Developer Portfolio"
    />
    <meta
      property="og:description"
      content="A modern, animated portfolio website showcasing mobile app development expertise, projects, and experience."
    />
    <meta
      property="og:image"
      content="https://mohamedadel120.github.io/my-Portfolio/icons/Icon-512.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://mohamedadel120.github.io/my-Portfolio/"
    />
    <meta
      property="twitter:title"
      content="Mohamed Adel - Flutter Developer Portfolio"
    />
    <meta
      property="twitter:description"
      content="A modern, animated portfolio website showcasing mobile app development expertise, projects, and experience."
    />
    <meta
      property="twitter:image"
      content="https://mohamedadel120.github.io/my-Portfolio/icons/Icon-512.png"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohamed Adel",
        "url": "https://mohamedadel120.github.io/my-Portfolio/",
        "image": "https://mohamedadel120.github.io/my-Portfolio/icons/Icon-512.png",
        "sameAs": [
          "https://github.com/mohamedadel120",
          "https://www.linkedin.com/in/mohamed-adel/"
        ],
        "jobTitle": "Flutter Developer",
        "worksFor": {
          "@type": "Organization",
          "name": "Freelance"
        },
        "description": "Experienced Flutter Developer specializing in building high-quality mobile applications for iOS and Android."
      }
    </script>

    <style>
      body {
        background-color: #050816; /* AppColors.background */
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
      }

      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .spinner-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
      }

      .spinner {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid rgba(0, 217, 255, 0.1); /* AppColors.primary with opacity */
        border-top: 3px solid #00d9ff; /* AppColors.primary */
        border-radius: 50%;
        animation: rotation 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .spinner-inner {
        position: absolute;
        top: 15%;
        left: 15%;
        width: 70%;
        height: 70%;
        border: 3px solid rgba(123, 44, 191, 0.1); /* AppColors.secondary with opacity */
        border-bottom: 3px solid #7b2cbf; /* AppColors.secondary */
        border-radius: 50%;
        animation: rotation 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
      }

      .loader-text {
        color: #ffffff;
        font-size: 16px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 600;
        opacity: 0.8;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.98);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.02);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-container">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
        <div class="spinner-inner"></div>
      </div>
      <div class="loader-text">Loading Mohamed's Portfolio</div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
